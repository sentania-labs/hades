# Crucible local operation (13). Normal mode: `make up`. Developer mode: `make dev`
# (postgres, the socket proxy and the egress proxy) with `uv run crucible serve --all`
# on the host.
#
# This project runs on the dedicated rootless daemon of the `crucible` service user
# (S9, ADR 0004). Point your own docker at it before running compose:
#
#   export DOCKER_HOST=unix:///run/user/$(id -u crucible)/docker.sock
#
# `make up` does that for you. Workers, collectors, verifiers and preparers are not
# services here: Crucible creates them through the socket proxy on the
# `crucible-workers` network, so `docker compose down` leaves a running worker alone
# by design.
name: crucible

services:
  postgres:
    image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
    restart: unless-stopped
    environment:
      POSTGRES_USER: crucible
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: crucible
    volumes:
      - crucible-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crucible -d crucible"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The only container that ever mounts the Docker socket (13, ADR 0004). It narrows
  # the API surface; it cannot refuse a create body that asks for Privileged, which is
  # what the create-request policy in Crucible is for. S9: with this image EXEC=0
  # still lets POST /containers/{id}/exec create an exec instance, but /exec/{id}/start
  # is refused, so no command can run.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1
      EXEC: 0
      BUILD: 0
      SWARM: 0
      SYSTEM: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      INFO: 0
      LOG_LEVEL: warning
    volumes:
      # The rootless daemon's socket. `make up` fills CRUCIBLE_DOCKER_SOCKET in from
      # `id -u crucible`; never hardcode 999, it differs per host (S9).
      - ${CRUCIBLE_DOCKER_SOCKET:-/run/user/999/docker.sock}:/var/run/docker.sock:ro
    networks:
      - default

  # The workers' only way out (13). squid cannot open /dev/stdout as the unprivileged
  # `proxy` user (S9), but this image's entrypoint tails the access log into the
  # container log, so `docker compose logs egress-proxy` carries every CONNECT and
  # every refusal. The allowlist is generated by `make proxies` from the policy.
  egress-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        marker=/etc/squid/dynamic/reload
        config=/etc/squid/dynamic/squid.conf
        (
          seen="$$(cat "$$marker" 2>/dev/null || true)"
          while sleep 1; do
            current="$$(cat "$$marker" 2>/dev/null || true)"
            if [ -n "$$current" ] && [ "$$current" != "$$seen" ]; then
              if /usr/sbin/squid -f "$$config" -k parse >/dev/null 2>&1 &&
                 /usr/sbin/squid -f "$$config" -k reconfigure; then
                printf '%s\n' "$$current" > /etc/squid/dynamic/.reloaded.incoming
                mv /etc/squid/dynamic/.reloaded.incoming /etc/squid/dynamic/reloaded
                seen="$$current"
              fi
            fi
          done
        ) &
        exec /usr/local/bin/entrypoint.sh -f "$$config" -NYC
    volumes:
      - crucible-egress:/etc/squid/dynamic
    networks:
      - default
      - crucible-workers
    depends_on:
      credential-init:
        condition: service_completed_successfully

  # The publisher's only way out (23 step 3). A separate proxy from the workers' one
  # because its allowlist is narrower: the one container that holds a GitHub credential
  # reaches GitHub and nothing else.
  publish-proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    restart: unless-stopped
    volumes:
      - ./var/egress/squid-publish.conf:/etc/squid/squid.conf:ro
    networks:
      - default
      - crucible-publish

  migrate:
    # These manifests are examples that track `latest`. A real deployment copies them
    # into the deployer's own repository and pins the exact tag and digest there
    # (sdlc skill).
    # Use `make up`: it passes --build, so your working tree is what runs. A bare
    # `docker compose up` pulls the published `latest` when one exists and only
    # builds if the pull fails, which is not what you want while developing.
    # CRUCIBLE_IMAGE lets the release workflow boot one exact, locally built
    # candidate instead of whatever `latest` currently resolves to.
    image: ${CRUCIBLE_IMAGE:-ghcr.io/sentania-labs/crucible:latest}
    build: .
    profiles: ["full"]
    command: ["crucible", "admin", "migrate"]
    environment:
      CRUCIBLE_DATABASE__URL: postgresql+psycopg://crucible:${POSTGRES_PASSWORD}@postgres:5432/crucible
      CRUCIBLE_LOCAL_ENDPOINT_URL: "${CRUCIBLE_LOCAL_ENDPOINT_URL:-${CRUCIBLE_SPARK_ENDPOINT_URL:-}}"
      # ADR 0016: the first-run administrator token is written to
      # first-run-admin-token (mode 0600) in the credential root, never to this
      # container's log. Read it with
      # `docker compose exec crucible cat /var/lib/crucible/credentials/first-run-admin-token`;
      # the service removes it on that administrator's first sign-in.
      CRUCIBLE_DOCKER__CREDENTIAL_ROOT: /var/lib/crucible/credentials
    volumes:
      - crucible-credentials:/var/lib/crucible/credentials
    depends_on:
      postgres:
        condition: service_healthy
      credential-init:
        condition: service_completed_successfully

  credential-init:
    # Docker creates a fresh named volume as root. Give only the volume root to the
    # service uid so the first browser-driven login can create its harness directory.
    # Existing credential files are not traversed or changed on later starts.
    image: ${CRUCIBLE_IMAGE:-ghcr.io/sentania-labs/crucible:latest}
    profiles: ["full"]
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        chown 1000:1000 /var/lib/crucible/credentials &&
        chown 1000:1000 /var/lib/crucible/credentials/github &&
        install -d -m 0700 -o 1000 -g 1000 /var/lib/crucible/credentials/hermes &&
        install -d -m 0755 -o 1000 -g 1000 /var/lib/crucible/egress &&
        install -m 0644 -o 1000 -g 1000 /seed/squid.conf /var/lib/crucible/egress/squid.conf
    volumes:
      - crucible-credentials:/var/lib/crucible/credentials
      - crucible-github-credentials:/var/lib/crucible/credentials/github
      - crucible-egress:/var/lib/crucible/egress
      - ./var/egress:/seed:ro

  crucible:
    # Tracks `latest`; deployments pin an exact tag (see migrate above).
    image: ${CRUCIBLE_IMAGE:-ghcr.io/sentania-labs/crucible:latest}
    build: .
    profiles: ["full"]
    restart: unless-stopped
    command: ["crucible", "serve", "--all"]
    environment:
      CRUCIBLE_DATABASE__URL: postgresql+psycopg://crucible:${POSTGRES_PASSWORD}@postgres:5432/crucible
      CRUCIBLE_SERVICE__BIND: 0.0.0.0:8080
      CRUCIBLE_SERVICE__RENDER_TIMEZONE: America/Chicago
      CRUCIBLE_SUPERVISOR__HOLDER: crucible-compose
      # The fake provider and the script harness are test fixtures (crucible#124): off
      # unless the environment turns them on, as CI's compose smoke does.
      CRUCIBLE_TEST_FIXTURES: "${CRUCIBLE_TEST_FIXTURES:-false}"
      # The Docker provider (08, 13). S9 Test E: the service runs as uid 1000 and the
      # artifact root is a named volume it shares with every container it creates, so
      # workspaces, identity renders, report dirs and collector output have one owner
      # and no chown step is needed anywhere.
      CRUCIBLE_DOCKER__ENABLED: "true"
      CRUCIBLE_DOCKER__HOST: tcp://docker-socket-proxy:2375
      CRUCIBLE_DOCKER__MOUNT_KIND: volume
      CRUCIBLE_DOCKER__ARTIFACT_VOLUME: crucible_crucible-artifacts
      CRUCIBLE_DOCKER__CREDENTIAL_VOLUME: crucible_crucible-credentials
      CRUCIBLE_DOCKER__CREDENTIAL_ROOT: /var/lib/crucible/credentials
      CRUCIBLE_DOCKER__WORKERS_NETWORK: crucible-workers
      CRUCIBLE_DOCKER__EGRESS_PROXY: http://egress-proxy:3128
      # A JSON array: pydantic-settings decodes a complex field from the environment
      # as JSON, and the list here must be the one `make proxy-config` gave squid.
      CRUCIBLE_DOCKER__EGRESS_ALLOWLIST: >-
        ${CRUCIBLE_EGRESS_ALLOWLIST:-["github.com","objects.githubusercontent.com","pypi.org","files.pythonhosted.org","registry.npmjs.org","api.anthropic.com","api.openai.com","auth.openai.com","chatgpt.com","daily-cloudcode-pa.googleapis.com","oauth2.googleapis.com","www.googleapis.com","lh3.googleusercontent.com"]}
      CRUCIBLE_LOCAL_ENDPOINT_URL: "${CRUCIBLE_LOCAL_ENDPOINT_URL:-${CRUCIBLE_SPARK_ENDPOINT_URL:-}}"
      CRUCIBLE_ADMIN__PROXY_CONFIG_PATH: /var/lib/crucible/egress/squid.conf
      CRUCIBLE_ADMIN__PROXY_SUBNET: "${CRUCIBLE_WORKERS_SUBNET:-10.88.0.0/24}"
      CRUCIBLE_ADMIN__PROXY_RELOAD_TIMEOUT_SECONDS: "10"
      # GitHub delivery (12, 23). Off until an App is configured. The App id is a public
      # identifier and the two secrets are *paths* to files in the credential directory
      # mounted below, which only this container ever sees: no worker, collector,
      # verifier or publisher mounts it. Installation tokens are minted per job and live
      # in memory and in the publisher's tmpfs, never here.
      CRUCIBLE_GITHUB__ENABLED: "${CRUCIBLE_GITHUB_ENABLED:-false}"
      CRUCIBLE_GITHUB__APP__APP_ID: "${CRUCIBLE_GITHUB_APP_ID:-0}"
      CRUCIBLE_GITHUB__APP__PRIVATE_KEY_PATH: /var/lib/crucible/credentials/github/app.pem
      CRUCIBLE_GITHUB__APP__WEBHOOK_SECRET_PATH: /var/lib/crucible/credentials/github/webhook.secret
      # The accelerator, off by default on a workstation: polling is the complete
      # observation path and GitHub cannot reach a laptop anyway (Q13, 23).
      CRUCIBLE_GITHUB__WEBHOOK_ENABLED: "${CRUCIBLE_GITHUB_WEBHOOK_ENABLED:-false}"
      CRUCIBLE_GITHUB__PUBLISHER_NETWORK: crucible-publish
      CRUCIBLE_GITHUB__PUBLISHER_EGRESS_PROXY: http://publish-proxy:3128
      # The harness credentials (12): one directory per harness under the root mounted
      # below, referenced by path, never by value. Mount mode is chosen on Credentials.
      CRUCIBLE_CREDENTIALS__CLAUDE_CODE__PATH: /var/lib/crucible/credentials/claude_code
      CRUCIBLE_CREDENTIALS__CODEX__PATH: /var/lib/crucible/credentials/codex
      CRUCIBLE_CREDENTIALS__AGY__PATH: /var/lib/crucible/credentials/agy
      CRUCIBLE_CREDENTIALS__HERMES__PATH: /var/lib/crucible/credentials/hermes
    volumes:
      - crucible-artifacts:/var/lib/crucible/artifacts
      # The credential root (12, 25), on this container only. Ordinary workers receive
      # per-attempt copies. A login container receives one named-volume subpath and no
      # workspace. The GitHub App credential directory is a writable named volume so that
      # Connect GitHub can write app.pem and webhook.secret. The harness volume starts
      # empty, so a fresh deployment needs no host directories.
      - crucible-github-credentials:/var/lib/crucible/credentials/github
      - crucible-credentials:/var/lib/crucible/credentials
      - crucible-egress:/var/lib/crucible/egress
    ports:
      - "127.0.0.1:${CRUCIBLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/v1/ready', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      credential-init:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started
      egress-proxy:
        condition: service_started
      publish-proxy:
        condition: service_started

networks:
  default:
  # internal: no default route, no resolver, and no reach to postgres, crucible or the
  # socket proxy (13, S4). The egress proxy sits on both sides and is the only way out.
  crucible-publish:
    name: crucible-publish
    internal: true
    ipam:
      config:
        - subnet: ${CRUCIBLE_PUBLISH_SUBNET:-10.88.1.0/24}
  crucible-workers:
    name: crucible-workers
    internal: true
    # Declared so the egress proxy's source ACL can name it; the generated squid
    # configuration and this must agree (see WORKERS_SUBNET in the Makefile).
    ipam:
      config:
        - subnet: ${CRUCIBLE_WORKERS_SUBNET:-10.88.0.0/24}

volumes:
  crucible-pg:
  crucible-artifacts:
  crucible-credentials:
  crucible-github-credentials:
  crucible-egress:
