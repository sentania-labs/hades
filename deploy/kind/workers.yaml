# Hades's own rootless BuildKit on the kind tier (hades #475): the same namespace,
# admission labels, ingress policy, claim, Service and Deployment as
# deploy/kubernetes/base/buildkit, with kind's `standard` storage class and a smaller
# claim. The image is the BUILDKIT_ROOTLESS_IMAGE pin from images/pins.env; the node
# pulls it from Docker Hub through the mirror tools/kind/cluster.sh configures.
# tests/e2e/test_kind_self_hosting.py waits for this rollout before it submits the task
# whose worker runs `make images-check` against it.
apiVersion: v1
kind: Namespace
metadata:
  name: hades-buildkit
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: buildkit
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hades-buildkit
  namespace: hades-buildkit
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: hades-buildkit}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: hades-workers}
      ports: [{protocol: TCP, port: 1234}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hades-buildkit-cache
  namespace: hades-buildkit
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hades-buildkit
  namespace: hades-buildkit
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: hades-buildkit}
  ports: [{name: buildkit, port: 1234, targetPort: buildkit}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hades-buildkit
  namespace: hades-buildkit
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: hades-buildkit}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hades-buildkit}
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: Unconfined}
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.0-rootless
          args: [--addr, tcp://0.0.0.0:1234, --oci-worker-no-process-sandbox]
          ports: [{name: buildkit, containerPort: 1234}]
          readinessProbe:
            exec: {command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "4", memory: 8Gi}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            appArmorProfile: {type: Unconfined}
          volumeMounts:
            - {name: cache, mountPath: /home/user/.local/share/buildkit}
      volumes:
        - name: cache
          persistentVolumeClaim: {claimName: hades-buildkit-cache}
---
apiVersion: v1
kind: Namespace
metadata:
  name: hades-workers
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: crucible-kind-peer
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hades-worker
  namespace: hades-workers
automountServiceAccountToken: false
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hades-workers
  namespace: hades-workers
spec:
  hard:
    count/jobs.batch: "17"
    # The tier's earlier cases keep their claims (their cleanup policy keeps the diff),
    # and the hades #189, #190 and #191 cases at the end of the file need five more.
    persistentvolumeclaims: "24"
    requests.cpu: "6"
    requests.memory: 8Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: hades-workers
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: crucible-kind-reference-cache
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: crucible-kind-cache
  hostPath:
    path: /crucible-kind-cache
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hades-reference-cache
  namespace: hades-workers
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: crucible-kind-cache
  volumeName: crucible-kind-reference-cache
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: peer-http
  namespace: crucible-kind-peer
  labels:
    app: peer-http
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: peer
      image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      command: ["sh", "-c", "mkdir -p /tmp/www; echo peer > /tmp/www/index.html; exec httpd -f -p 443 -h /tmp/www"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [NET_BIND_SERVICE]
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: peer-http
  namespace: crucible-kind-peer
spec:
  selector:
    app: peer-http
  ports:
    - name: http
      port: 443
      targetPort: 443
---
apiVersion: v1
kind: Pod
metadata:
  name: range-http
  namespace: kube-system
  labels:
    app: range-http
spec:
  hostNetwork: true
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: range-http
      image: busybox@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
      command: ["sh", "-c", "mkdir -p /www; echo range-control > /www/index.html; exec httpd -f -p 443 -h /www"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
          add: [NET_BIND_SERVICE]
      volumeMounts:
        - name: www
          mountPath: /www
        # hades #191: the tier's bare repositories, served read-only as a dumb-HTTP git
        # host at http://github.com:443/git/<name>.git (tools/kind/e2e-kind.sh).
        - name: git
          mountPath: /www/git
          readOnly: true
  volumes:
    - name: www
      emptyDir: {}
    - name: git
      hostPath:
        path: /crucible-kind-cache
        type: Directory
