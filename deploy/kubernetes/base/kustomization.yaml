# The deployable shape of Crucible (20 phase C9, 26). Two namespaces: `crucible` for the
# control plane and `crucible-workers` for everything an attempt becomes.
#
# This repository's manifests are examples and track `latest`, never a release tag: a
# real deployment copies overlays/lab into the deployer's own GitOps repository and pins
# there (docs/deployment.md). The Deployments and the migration Job name the repository
# with no tag at all so that this is the only line that can carry one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crucible
  - buildkit
  - workers
images:
  - name: ghcr.io/sentania-labs/crucible
    newTag: latest
