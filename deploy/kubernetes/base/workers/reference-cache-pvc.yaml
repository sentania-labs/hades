# The git reference cache the preparer clones from (26). One claim for the namespace,
# mounted read-write into the preparer, which refreshes and may replace its bare mirror
# (C8a). The storage class comes from the overlay: a cluster's classes are lab-admin's,
# not this repository's.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hades-reference-cache
  namespace: hades-workers
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: reference-cache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
