# The supervisor Pod runs in the `hades` namespace, so its ServiceAccount lives there;
# a Pod can only use an account from its own namespace. A RoleBinding may name a subject
# in another namespace, which is what keeps the permission itself namespaced to
# `hades-workers` exactly as 26 requires.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hades-supervisor
  namespace: hades-workers
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: supervisor
subjects:
  - kind: ServiceAccount
    name: hades-supervisor
    namespace: hades
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: hades-supervisor
