# Hades's private image builder. The image is the BUILDKIT_IMAGE pin from
# images/pins.env; TLS is intentionally disabled because only attempt NetworkPolicies
# selected by Hades can reach this ClusterIP.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crucible-buildkit-cache
  namespace: crucible
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-buildkit
  namespace: crucible
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crucible-buildkit
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-buildkit
  namespace: crucible
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-buildkit
      annotations:
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: Unconfined
      containers:
        - name: buildkitd
          image: moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          args: [--addr, tcp://0.0.0.0:1234, --oci-worker-no-process-sandbox]
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            appArmorProfile:
              type: Unconfined
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: crucible-buildkit-cache
