# kind's kube-dns clusterIP is the default 10.96.0.10, which the base already carries.
# What differs is the storage class, the sizes a one-node cluster can honour, and the
# worker-side timeouts: the disposable registry and the local-path provisioner are slower
# than a lab cluster on the first pull, and a task that is still pulling is not a stall.
# The kind tier drives the script harness, a test fixture a real deployment never shows or
# routes to (crucible#124), so this overlay turns the fixtures on. Times on the kind
# proofs are read in the lab's local zone, so this overlay renders America/Chicago.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hades-settings
  namespace: hades
data:
  CRUCIBLE_KUBERNETES__STORAGE_CLASS: standard
  CRUCIBLE_KUBERNETES__WORKSPACE_SIZE: 256Mi
  CRUCIBLE_KUBERNETES__MAX_CONCURRENCY: "1"
  CRUCIBLE_SUPERVISOR__TICK_SECONDS: "2"
  CRUCIBLE_SUPERVISOR__HOLDER: crucible-kind
  CRUCIBLE_TEST_FIXTURES: "true"
  CRUCIBLE_SERVICE__RENDER_TIMEZONE: America/Chicago
