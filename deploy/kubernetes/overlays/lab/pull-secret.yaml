# REPLACE: REPLACE_ME_IMAGE_PULL_SECRET   or delete this patch when the packages are public
#
# 26 checklist item 5. The same name goes in settings.yaml above, because the worker Pods
# the provider creates in `hades-workers` need it too and it is a setting there, not a
# ServiceAccount default.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hades-api
  namespace: hades
spec:
  template:
    spec:
      imagePullSecrets:
        - name: REPLACE_ME_IMAGE_PULL_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hades-supervisor
  namespace: hades
spec:
  template:
    spec:
      imagePullSecrets:
        - name: REPLACE_ME_IMAGE_PULL_SECRET
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hades-migrate
  namespace: hades
spec:
  template:
    spec:
      imagePullSecrets:
        - name: REPLACE_ME_IMAGE_PULL_SECRET
