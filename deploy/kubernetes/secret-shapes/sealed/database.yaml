# two views of one value and must agree (see ../README.md).
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: hades-database
  namespace: hades
spec:
  encryptedData:
    password: REPLACE_WITH_SEALED_DATABASE_PASSWORD
    url: REPLACE_WITH_SEALED_DATABASE_URL
  template:
    metadata:
      name: hades-database
      namespace: hades
    type: Opaque
