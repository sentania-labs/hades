# Lint, unit, integration, and a compose smoke on GitHub-hosted runners: the
# integration tier needs a Docker daemon and the repository is public (github-ci skill).
name: ci

# Every branch push runs every job, so a change is proven on its branch before there is
# a pull request, and the pull request's required checks (matched by name on the head
# commit) are that run's. There is no pull_request trigger because it would run the
# whole suite a second time on the same commit, including a second e2e-kind. The cost
# of that choice: a pull request from a fork never triggers this workflow, so it cannot
# satisfy the required checks; this repository takes no fork contributions today
# (operator decision, 2026-09-23).
on:
  push:
    # Every branch, main included. Hades merges a pull request once every job passed on
    # its head (operator decision, 2026-10-01: no merge queue, no gate job); the run on
    # main then proves the squashed result, and a red main gets a fix PR.
    branches: ["**"]
  # Manual escape hatch for 114: a branch push restores main's BuildKit cache in the
  # images job, so a change to a fetch or install step is only proven fresh from that
  # layer on. Dispatching this workflow with no_cache=true builds the images job from
  # scratch on that branch, the same way main and the release always do:
  #   gh workflow run ci.yml --ref <branch> -f no_cache=true
  # GitHub only offers the dispatch once this trigger is on the default branch; the
  # run then uses the branch's own copy of this file. It shares the branch's
  # concurrency group, so a later push to the branch cancels it (and it cancels an
  # in-flight push run, which it repeats in full).
  workflow_dispatch:
    inputs:
      no_cache:
        description: "images job: build from scratch (NO_CACHE=1) instead of restoring main's layer cache"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: run the shared lint, including the image manifest check
        run: make lint

  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: scan the tracked tree
        run: make scan-tree
      # The first push of a new branch has no `before` (all zeros), and a force push's
      # `before` is on no ref, so the clone does not have it; either way the range is
      # everything the branch adds to main.
      - name: scan the commits that just landed
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            make scan-history SCAN_RANGE="$BEFORE..$SHA"
          else
            make scan-history SCAN_RANGE="origin/main..$SHA"
          fi

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      # The runner has the Docker CLI, so the compose-rendering unit cases must run here,
      # not skip as they do in the worker image (hades #184).
      - run: make test
        env:
          CRUCIBLE_COMPOSE_REQUIRED: "1"

  # The end-to-end tier (18) on the runner's own rootful daemon. The local run is on
  # the dedicated rootless daemon (13, S9); this is the same tier, same targets, on the
  # arrangement CI has.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: build the script-harness worker image
        run: make e2e-image
      - run: make e2e
      - name: what the daemon was left holding, on failure
        if: failure()
        run: |
          docker ps -a --filter label=crucible.attempt
          docker network ls

  # The worker images (13, C11): the worker image carrying Claude Code, Codex, AGY and
  # Hermes, and the script-harness image, built from the pinned inputs with the same
  # script as `make images`. The job fails when any tag, harness version or OCI digest
  # differs from images/manifest.env (on a branch, a difference in digests alone is
  # committed instead; see below): reproducibility is the contract, and this is where
  # it is proved on a machine the author does not control. GitHub-hosted, because it
  # needs a Docker daemon and buildx (github-ci skill).
  #
  # Branch pushes import the BuildKit layer cache the last push to main exported, so
  # the job takes minutes. The digest is always computed from what the
  # build output, but a network step (apt, pip, ADD <url>) is cached on its instruction
  # text, not on the bytes it would fetch today, so a branch's pass is not on its own
  # proof that upstream still serves those bytes. That proof is every push to main, which
  # builds from scratch (NO_CACHE=1, nothing restored) before exporting the cache, and
  # the release, which builds from scratch again and pushes nothing unless the digests
  # match. A branch can force the same from-scratch proof early with workflow_dispatch
  # (114), for a change that touches a fetch or install step and should not wait for
  # main to find out a network step no longer reproduces.
  #
  # CI owns the *_DIGEST lines (FDY-0310, the operator's decision 2026-10-04). On a
  # branch, a build that reproduces every tag and harness version but not a digest
  # writes the built digests into images/manifest.env, commits them as
  # github-actions[bot] (one commit touching only those lines, its message naming the
  # images), pushes it, and passes. A push made with GITHUB_TOKEN starts no workflow, so
  # the job then dispatches this workflow on the branch, which runs every job on the new
  # head and cancels the rest of this run through the concurrency group. A tag or
  # harness version that differs still fails. Main never commits (it fails as before),
  # this workflow never runs on a tag, the release's images-check never writes back, and
  # a head that is the bot's own digest commit never commits again, so a digest that
  # does not reproduce twice fails instead of looping.
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the digest commit, on a branch only
      actions: write # dispatch CI on the digest commit
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The build runs the branch's scripts; only the commit step gets the token.
          persist-credentials: false
      - name: decide whether this run builds from scratch
        id: no_cache
        env:
          DISPATCH_NO_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.no_cache }}
          # The push to main builds from scratch: it is the from-scratch proof that every
          # network step still reproduces, and the cache it saves below is the one every
          # branch restores (a cache saved on the default branch is visible to all).
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ "$ON_MAIN" = "true" ] || [ "$DISPATCH_NO_CACHE" = "true" ]; then
            echo "value=1" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: restore the BuildKit layer cache
        if: steps.no_cache.outputs.value != '1'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-cache
          key: worker-images-${{ hashFiles('images/**') }}
          restore-keys: worker-images-
      - name: decide whether this run may commit corrected digests
        id: writeback
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if python3 tools/images/digest_commit.py may-commit --event "$EVENT" --ref "$REF" \
              --default-branch "$DEFAULT_BRANCH" --head-message "$(git log -1 --format=%B)"; then
            echo "value=1" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - name: build both images and compare with images/manifest.env
        env:
          NO_CACHE: ${{ steps.no_cache.outputs.value }}
          DIGEST_WRITEBACK: ${{ steps.writeback.outputs.value }}
        run: >-
          make images-check CACHE_DIR="$RUNNER_TEMP/buildkit-cache" NO_CACHE="$NO_CACHE"
          DIGEST_WRITEBACK="$DIGEST_WRITEBACK"
      - name: commit the corrected digests to the branch
        id: digest_commit
        if: steps.writeback.outputs.value == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- images/manifest.env; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Refuses any change but the manifest's digest lines.
          python3 tools/images/digest_commit.py commit
          git show --stat HEAD
          # Not forced: a branch that moved meanwhile rejects the push and fails the job.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
          echo "committed=true" >> "$GITHUB_OUTPUT"
      - name: keep the layer cache for branches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildkit-cache
          key: worker-images-${{ hashFiles('images/**') }}
      # hades #181, #184: the image just built must carry the program each shipped
      # policy's required check starts with (make, for default-software's make lint,
      # test, scan) and every program a shipped policy declares in required_programs.
      # After a digest commit this head is superseded: the dispatched run repeats these
      # on the new head, which builds the same image.
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        if: steps.digest_commit.outputs.committed != 'true'
        with:
          enable-cache: true
      - name: the worker image carries the programs the shipped policies' checks need
        if: steps.digest_commit.outputs.committed != 'true'
        run: make images-policy-check
      # hades #184, FDY-0134: the unit tier as the lab's verification runs it, in the
      # image just built: uid 1000, read-only root, no Docker socket, no network for
      # the tests (only `uv sync` gets one), and setgid fsGroup-style /tmp and
      # workspace. Here rather than its own job because the image exists only in this
      # job's daemon; moving 1.4 GB to another job costs more than the tier's minute.
      - name: unit tier inside the worker image
        if: steps.digest_commit.outputs.committed != 'true'
        run: make test-unit-in-image
      - name: run CI on the digest commit
        if: steps.digest_commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "$REPOSITORY" --ref "$BRANCH"

  # A real API server, kubelet, enforcing CNI and PVC on the runner's Docker daemon.
  # This belongs beside the Docker tier on GitHub-hosted infrastructure: it needs a
  # daemon but no lab access (github-ci skill).
  e2e-kind:
    runs-on: ubuntu-24.04
    # Three shards (hades #222), each on its own disposable cluster, selected from
    # tools/kind/shards/<n>.txt; tests/unit/test_kind_shards.py proves every kind test
    # is in exactly one shard. One shard ran about 28 minutes as a single job; a third
    # of it fits well inside this limit.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 20
    env:
      CRUCIBLE_E2E_KIND_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: install kind
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  '"$RUNNER_TEMP/kind" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Pinned the same way as the manifests job (69): this tier's kubectl applies
      # Calico and drives the cluster, so a different kubectl behaving differently is
      # exactly the kind of drift reproducibility here is supposed to rule out. Its
      # minor version follows the kind node image (tools/kind/cluster.sh, 1.37), not
      # the manifests job's, to stay inside kubectl's one-minor skew policy.
      - name: install kubectl
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/kubectl" \
            https://dl.k8s.io/release/v1.37.1/bin/linux/amd64/kubectl
          echo '65691ff77eb6fa44c908b77a1082c9f092c3b9733b5cefabec0d1104890e21a8  '"$RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: build the script-harness worker image
        run: make e2e-image
      - name: run the kind tier
        run: make e2e-kind

  # The registry adapter through the real crane the service image ships (108): a stub
  # registry that redirects its blobs to another host, then an anonymous resolve of the
  # published worker image on GHCR, asserting its digest and harness labels. It needs the
  # internet and neither a Docker daemon nor the lab, and the repository is public, so it
  # is GitHub-hosted (github-ci skill rule 4). No secret: the package is public.
  registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: resolve through the pinned crane
        run: make registry-check

  # The deployment manifests (C9). `kubectl kustomize` and `kubeconform` need neither a
  # Docker daemon nor lab access, and the repository is public, so hosted minutes are
  # free: GitHub-hosted under the github-ci skill's rule 4. It is deliberately not the
  # `lab` pool, which exists to reach the lab and would only queue for a job that needs
  # nothing from it.
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          enable-cache: true
      - name: install kubeconform
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/kubeconform.tgz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo '95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  '"$RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # kubectl carries the kustomize build, so it is pinned rather than taken from
      # whatever the runner image happens to ship: a different kustomize renders
      # differently, and the whole point of this job is that what it renders is what a
      # local `make manifests` rendered.
      - name: install kubectl
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/kubectl" \
            https://dl.k8s.io/release/v1.31.6/bin/linux/amd64/kubectl
          echo 'c46b2f5b0027e919299d1eca073ebf13a4c5c0528dd854fc71a5b93396c9fa9d  '"$RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: the kustomize and kubeconform versions in use
        run: |
          kubectl version --client
          kubeconform -v
      - name: render and validate every manifest
        run: make manifests

  compose-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: classify release candidate and supporting images
        run: make release-images-classify
      - name: make up from a clean clone
        # The smoke drives the fake provider, a test fixture off by default (crucible#124).
        env:
          CRUCIBLE_TEST_FIXTURES: "true"
        run: make up
      # tools/smoke/compose_smoke.py is the only definition of this smoke; the
      # release workflow runs the same file against the image it is about to
      # publish, so a task contract change that breaks the release breaks the
      # pull request first.
      - name: the shared compose smoke
        run: make smoke
      - name: logs on failure
        if: failure()
        run: docker compose logs
      - name: down
        if: always()
        run: make down
