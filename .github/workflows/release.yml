# The tag push is the release (sdlc skill). This workflow owns every step after
# it: refuse a bad tag, build, smoke the image an operator would run, prove the worker
# images, push everything to GHCR with `docker push`, and only then cut the GitHub
# release.
#
# GitHub-hosted runners: the smoke test is `docker compose`, which needs a real
# Docker daemon, and the repository is public so hosted minutes are free
# (github-ci skill). Nothing here touches the lab.
name: release

on:
  push:
    tags: ["v*.*.*"]

# Repo-wide, not per-ref, and never cancelled: two tags pushed close together
# would otherwise both read the published tag list before either pushed, both
# conclude they are the highest version, and race `latest` onto the lower one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sentania-labs/crucible
  WORKER_REGISTRY: ghcr.io/sentania-labs/crucible-worker

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      packages: write # push to GHCR
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
          # hades #476: `fetch-depth: 0` alone does not fetch tags (actions/checkout's
          # own default is `--no-tags`); `find the previous release` below needs every
          # earlier vMAJOR.MINOR.PATCH tag's history, not only the one that triggered
          # this run.
          fetch-tags: true

      # Gate 1. A tag on a stray branch, or a tag that is not vMAJOR.MINOR.PATCH,
      # must not publish anything.
      - name: refuse a bad tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Leading zeros are rejected: v1.02.3 would install as 1.2.3 and the
          # version check below would fail confusingly after a full build.
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "tag $TAG is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          # FETCH_HEAD, not origin/main: on a tag ref the remote-tracking branch
          # may not exist, and merge-base would then error with a message that
          # reads like an unreachable commit.
          git fetch --no-tags origin main
          MAIN=$(git rev-parse FETCH_HEAD)
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN"; then
            echo "commit $GITHUB_SHA is not reachable from main ($MAIN); refusing to publish" >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # hades #573 / #476: find the previous release, defined as the highest version
      # below this one whose worker image is actually published on the registry.
      # The previous tag's release may have failed (hades #570) — that tag is a git
      # release but has no published worker image, so re-pushing from it would fail.
      # `tools/release/published_versions.py` queries the GHCR registry API for the
      # worker package tags (anonymous, no credential, same pattern as the "move
      # latest" step) and prints only bare version strings (N.N.N); those feed into
      # version.py --previous which picks the highest version below the candidate.
      # The later `git show v<previous>:images/manifest.env` still works because every
      # published version is also a git tag.  If the package has no published versions,
      # the script prints nothing and the existing "no previous release" path runs.
      # `tools/release/version.py --previous` never answers with this release's own
      # version, even if this run is a re-run of a tag that is somehow already in the
      # list.
      - name: find the previous release
        id: previous
        env:
          WORKER_REGISTRY: "ghcr.io/sentania-labs/crucible-worker"
        run: |
          set -euo pipefail
          PREV=$(python3 tools/release/published_versions.py --registry "$WORKER_REGISTRY" \
            | python3 tools/release/version.py --previous "$VERSION")
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          if [ -n "$PREV" ]; then
            echo "release: the previous release is v$PREV"
          else
            echo "release: no previous release found; this is the first one"
          fi

      # Compares this release's declared worker and script-harness tags against the
      # previous release's (read from its own commit, not the working tree, since that
      # tag's manifest is exactly what it published): each image rebuilds only when its
      # own tag differs (finding 01M4CG0K1TQH50GM73R9H9CQRB -- the two are decided
      # independently, since a harness-only bump must not be silently republished under
      # the previous harness). tools/release/worker_decision.py is the single
      # definition, unit-tested at tests/unit/test_issue_476_scoped_ci_classes.py, and
      # prints `reuse=`, `previous_worker_tag=`, `harness_reuse=` and
      # `previous_harness_tag=` directly in $GITHUB_OUTPUT's own key=value form.
      - name: decide whether the worker image build is needed
        id: worker_decision
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "release: no previous release to compare; building the worker image"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "harness_reuse=false" >> "$GITHUB_OUTPUT"
          else
            git show "v${PREVIOUS_VERSION}:images/manifest.env" > "$RUNNER_TEMP/previous-manifest.env"
            python3 tools/release/worker_decision.py --current images/manifest.env \
              --previous "$RUNNER_TEMP/previous-manifest.env" >> "$GITHUB_OUTPUT"
          fi

      # Gate 2. The version reaches the image through the build arg, because
      # .git is not in the build context.
      - name: log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # A published version is immutable. If this version is already in GHCR
      # from this same commit, the run is a re-run of a transient failure and
      # the push is skipped. If it is there from a DIFFERENT commit, the tag was
      # moved: that is an escalation, never a quiet re-publish (ADR 0010).
      #
      # The registry API, not `docker manifest inspect`: only an explicit 404
      # means absent. A network blip, a rate limit or an auth problem must stop
      # the job, because treating those as "absent" would republish over a
      # version that already exists.
      - name: refuse to republish a moved tag
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REG_TOKEN=$(curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:sentania-labs/crucible:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -X GET \
            -H "Authorization: Bearer $REG_TOKEN" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/sentania-labs/crucible/manifests/${VERSION}")
          case "$CODE" in
            404)
              echo "ALREADY_PUBLISHED=false" >> "$GITHUB_ENV"
              echo "${VERSION} is not published yet"
              exit 0
              ;;
            200) ;;
            *)
              echo "::error::GHCR returned HTTP $CODE for manifest ${VERSION}; cannot tell whether this version is already published, so refusing to continue"
              exit 1
              ;;
          esac
          docker pull -q "${IMAGE}:${VERSION}"
          REV=$(docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          if [ "$REV" != "$GITHUB_SHA" ]; then
            echo "::error::${IMAGE}:${VERSION} is already published from commit ${REV:-unknown}, but the tag now points at ${GITHUB_SHA}. A published version is never overwritten. Cut a new version instead."
            exit 1
          fi
          echo "ALREADY_PUBLISHED=true" >> "$GITHUB_ENV"
          echo "${VERSION} is already published from this commit; this run will re-verify but not re-push"

      - name: build the image
        run: |
          set -euo pipefail
          docker build --build-arg "VERSION=${VERSION}" --build-arg "REVISION=${GITHUB_SHA}" \
            -t "${IMAGE}:${VERSION}" .

      - name: the image reports the tagged version
        run: |
          set -euo pipefail
          GOT=$(docker run --rm --entrypoint python "${IMAGE}:${VERSION}" \
            -c 'import crucible; print(crucible.__version__)')
          echo "package version: $GOT"
          [ "$GOT" = "${VERSION}" ]
          LABEL=$(docker image inspect "${IMAGE}:${VERSION}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "image label: $LABEL"
          [ "$LABEL" = "${VERSION}" ]

      # Gate 3, part one. Boot the exact image that is about to be published,
      # the way an operator boots it, and prove the running containers are that
      # image. Part two drives a task through it.
      - name: boot the built image and prove it is the candidate
        env:
          CRUCIBLE_IMAGE: ghcr.io/sentania-labs/crucible:${{ env.VERSION }}
          # The smoke drives the fake provider, a test fixture off by default (crucible#124).
          CRUCIBLE_TEST_FIXTURES: "true"
        run: |
          set -euo pipefail
          cp .env.example .env
          # --pull never applies to EVERY service, not just the candidate, and a
          # fresh runner has nothing cached, so the pinned supporting images have
          # to be fetched explicitly first. The first live run of this workflow
          # (tag v0.1.0, run 35158679884) died here on
          # "No such image: postgres:16@sha256:f1c3...". Every service except the
          # candidate image is excluded by its resolved image value, not by a
          # service name. CI runs the same classifier on every pull request.
          make release-images-pull
          # CRUCIBLE_IMAGE pins compose to this run's versioned local tag and
          # --pull never forbids reaching the registry for the candidate, so a
          # v0.2.0 run can never end up smoking the published v0.1.0. --pull
          # never alone would permit Compose to build services that have a
          # build section. --no-build makes an absent candidate fail instead.
          # The image ID is still checked below rather than trusted.
          make up COMPOSE_UP_FLAGS="--pull never --no-build"
          # Prove every service that resolves to the candidate image uses the
          # freshly built image ID. This includes exited one-shot containers.
          make release-images-verify
          echo "candidate image confirmed; handing off to the shared smoke"

      # The smoke body itself is tools/smoke/compose_smoke.py, the same file CI
      # runs on every pull request. It is not copied here: the v0.2.0 run
      # (35167333375) failed because the copy that used to live in this file was
      # still written for the pre-C2 task contract.
      - name: the shared compose smoke
        env:
          CRUCIBLE_IMAGE: ghcr.io/sentania-labs/crucible:${{ env.VERSION }}
          CRUCIBLE_SMOKE_EXPECT_VERSION: ${{ env.VERSION }}
        run: make smoke

      - name: logs on failure
        if: failure()
        env:
          CRUCIBLE_IMAGE: ghcr.io/sentania-labs/crucible:${{ env.VERSION }}
          POSTGRES_PASSWORD: CHANGE_ME
        run: docker compose logs

      - name: down
        if: always()
        env:
          CRUCIBLE_IMAGE: ghcr.io/sentania-labs/crucible:${{ env.VERSION }}
          POSTGRES_PASSWORD: CHANGE_ME
        run: make down

      # Gate 3, part three. The worker images (13, C11): the worker image carrying
      # Claude Code, Codex, AGY and Hermes, and the script-harness image. A build from
      # scratch on this fresh runner has to reproduce every tag, harness version and OCI
      # digest images/manifest.env declares, with the same script `make images` and the
      # CI images job run, not a copy (the c7c, c7e and c7f lesson). The build leaves
      # both images loaded in the daemon.
      #
      # hades #476: skipped only when the previous release already published both the
      # exact WORKER and SCRIPT_HARNESS tags this manifest declares (`decide whether
      # the worker image build is needed` above) -- "Maybe we need to not build a
      # worker with every single release" (the operator, 2026-10-06). The previous
      # release's own CI and release runs already proved those tags reproduce;
      # re-proving them on every later release that changes nothing about them buys
      # nothing. A change to either tag alone still runs this step: images.sh builds
      # both images together, so there is no way to rebuild only the one that moved
      # (finding 01M4CG0K1TQH50GM73R9H9CQRB -- a harness-only bump must not be
      # silently republished under the previous release's stale harness).
      - name: build and prove the worker images
        if: steps.worker_decision.outputs.reuse != 'true' || steps.worker_decision.outputs.harness_reuse != 'true'
        run: make images-check NO_CACHE=1

      # hades #185: after building the worker images, prove the worker image carries
      # every program a shipped policy's required check starts with or declares, so a
      # release whose worker image and shipped policies disagree stops before anything
      # is published.
      #
      # hades #570: only when the worker image was built on this runner. When the
      # worker image is reused (both tags unchanged since the previous release),
      # `make images-policy-check` runs `docker run` against the local tag from
      # images/manifest.env, which was never built on this runner; docker exits 125
      # and the release stops. A reused worker image passed this check at its own
      # release; its digest is re-published unchanged, so the check is unnecessary.
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        if: steps.worker_decision.outputs.reuse != 'true' || steps.worker_decision.outputs.harness_reuse != 'true'
        with:
          enable-cache: true
      - name: check the worker image carries the policy programs
        if: steps.worker_decision.outputs.reuse != 'true' || steps.worker_decision.outputs.harness_reuse != 'true'
        run: make images-policy-check

      # The worker images go out the way this image does, with `docker push` (the
      # operator's decision, 2026-09-23): <version> and script-harness-<version> on
      # WORKER_REGISTRY. The never-overwrite rule is the service image's: an existing
      # tag built from the same inputs is a re-run and is skipped, one built from
      # anything else stops the release, and only buildx's own "not found" counts as
      # absent. It comes before the service image's version tag is pushed, so a release
      # whose worker images cannot be pushed publishes no service version. Both tags
      # push whenever either changed (the condition above), since images-check just
      # built both from the manifest's current, reproducible inputs.
      - name: push the worker images, never over an existing version
        if: steps.worker_decision.outputs.reuse != 'true' || steps.worker_decision.outputs.harness_reuse != 'true'
        run: tools/release/push_worker_images.sh

      # hades #476: the reuse path, only when both tags are unchanged. Nothing was
      # built above, so nothing is pushed; instead the previous release's
      # already-published worker images are copied to this version's tags on the
      # registry, by digest, the same `docker buildx imagetools create` the "move
      # latest" step below uses to move `latest` without pushing from a local build.
      # The release notes name the reused image and digest (`make release-notes
      # WORKER_REUSED_FROM=`).
      - name: re-publish the previous release's worker images by digest
        if: steps.worker_decision.outputs.reuse == 'true' && steps.worker_decision.outputs.harness_reuse == 'true'
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: |
          set -euo pipefail
          echo "release: images/manifest.env's WORKER and SCRIPT_HARNESS tags are unchanged since v${PREVIOUS_VERSION}; reusing the published images by digest instead of rebuilding"
          docker buildx imagetools create --prefer-index=false \
            -t "${WORKER_REGISTRY}:${VERSION}" "${WORKER_REGISTRY}:${PREVIOUS_VERSION}"
          docker buildx imagetools create --prefer-index=false \
            -t "${WORKER_REGISTRY}:script-harness-${VERSION}" \
            "${WORKER_REGISTRY}:script-harness-${PREVIOUS_VERSION}"

      # The candidate's own crane resolves the published worker image on GHCR (108): the
      # same adapter the Kubernetes provider runs, inside the image about to be
      # published, so a service image that cannot resolve a worker image never ships.
      # Compare the published build inputs with actual latest, which follows the highest
      # published version, not the nearest ancestor tag (delayed patch releases differ).
      # Changed inputs use the immutable version tag pushed immediately above; identical
      # inputs keep checking latest. The crane check is anonymous: the package is public
      # and no credential is passed in.
      - name: the image resolves the published worker image through its crane
        run: |
          set -euo pipefail
          WORKER_REFERENCE=$(python3 tools/release/worker_check_reference.py \
            --registry "${WORKER_REGISTRY}" --version "${VERSION}")
          echo "checking worker image: ${WORKER_REFERENCE}"
          docker run --rm -v "$PWD/tools/registry:/check:ro" --entrypoint python \
            "${IMAGE}:${VERSION}" /check/check_published.py \
            --reference "${WORKER_REFERENCE}"

      # Gate 4. Publish. An existing version tag is never overwritten: a re-run
      # after a transient failure skips the push instead of failing on it.
      - name: push the version tag, never over an existing one
        run: |
          set -euo pipefail
          if [ "$ALREADY_PUBLISHED" = true ]; then
            echo "${IMAGE}:${VERSION} already published from this commit; leaving it alone"
          else
            docker push "${IMAGE}:${VERSION}"
          fi

      # `latest` follows the highest published version, not the most recent
      # push, so re-tagging an old fix does not move it backwards. A tag list
      # that cannot be read is fatal: treating a failed lookup as "no versions
      # published" would move `latest` in exactly the direction this prevents.
      # The comparison itself (which tags are versions, which of them is highest)
      # is tools/release/version.py. All three images' latest move here, under
      # the same answer, one rule and one step: each is copied on the registry
      # from its own just-confirmed version tag (--prefer-index=false copies the
      # manifest as is), never pushed from this job's local build, so latest
      # always carries exactly the digest the version tag does, even on a re-run
      # that skipped the version push because the tag was already there.
      - name: move latest only if this is the highest published version
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REG_TOKEN=$(curl -fsS -u "$GHCR_USER:$GHCR_TOKEN" \
            "https://ghcr.io/token?scope=repository:sentania-labs/crucible:pull" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          URL="https://ghcr.io/v2/sentania-labs/crucible/tags/list?n=100"
          TAGS=""
          BODY=$(mktemp)
          HEAD=$(mktemp)
          for _ in $(seq 1 20); do
            CODE=$(curl -sS -o "$BODY" -D "$HEAD" -w '%{http_code}' \
              -H "Authorization: Bearer $REG_TOKEN" "$URL")
            if [ "$CODE" = 404 ]; then
              echo "no package published yet; this is the first version"
              break
            fi
            if [ "$CODE" != 200 ]; then
              echo "::error::GHCR tag list returned HTTP $CODE; refusing to guess whether ${VERSION} is the highest version"
              exit 1
            fi
            TAGS="$TAGS
          $(python3 -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1])).get("tags") or []))' "$BODY")"
            NEXT=$(sed -n 's/.*<\([^>]*\)>.*rel="next".*/\1/Ip' "$HEAD" | head -n 1)
            [ -n "$NEXT" ] || break
            case "$NEXT" in
              /*) URL="https://ghcr.io$NEXT" ;;
              *) URL="$NEXT" ;;
            esac
          done
          HIGHEST=$(printf '%s\n' "$TAGS" | python3 tools/release/version.py "${VERSION}")
          echo "highest published version: $HIGHEST"
          if [ "$HIGHEST" = "${VERSION}" ]; then
            # Three registry-side copies, each from that image's own version tag. The
            # service image goes last, so a failure partway leaves the service latest
            # where it was rather than ahead of the worker images (the example
            # manifests track latest).
            docker buildx imagetools create --prefer-index=false \
              -t "${WORKER_REGISTRY}:latest" "${WORKER_REGISTRY}:${VERSION}"
            docker buildx imagetools create --prefer-index=false \
              -t "${WORKER_REGISTRY}:script-harness-latest" "${WORKER_REGISTRY}:script-harness-${VERSION}"
            docker buildx imagetools create --prefer-index=false \
              -t "${IMAGE}:latest" "${IMAGE}:${VERSION}"
          else
            echo "${VERSION} is not the highest; leaving latest where it is"
          fi

      # The runbook's source for REPLACE_ME_CRUCIBLE_DIGEST (docs/deployment.md): all
      # three images are on the registry by now, so their digests are read back from it
      # with `docker buildx imagetools inspect`, never taken from a local build: `docker
      # push` re-encodes the layers, so the local OCI digest is not what anyone pulls.
      - name: render the release notes with the published digests
        env:
          CRUCIBLE_IMAGE: ${{ env.IMAGE }}:${{ env.VERSION }}
          # hades #476: named only on the reuse path (both tags unchanged), so the
          # notes say plainly that the worker image is a republish, not a fresh build.
          WORKER_REUSED_FROM: >-
            ${{ steps.worker_decision.outputs.reuse == 'true' && steps.worker_decision.outputs.harness_reuse == 'true' && steps.previous.outputs.version || '' }}
        run: make release-notes > release-notes.md

      # Gate 5. The release is created last, so a GitHub release never points at
      # a version that is not consumable from the registry.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md --generate-notes
          fi
