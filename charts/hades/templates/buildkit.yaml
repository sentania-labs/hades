# Hades's private image builder (hades #475): the BuildKit a worker or a verifier Pod
# builds the worker images through when its contract requires `make images-check`, so
# the reproducibility check runs inside Hades and not on the lab's shared CI builder.
#
# The image is the BUILDKIT_ROOTLESS_IMAGE pin from images/pins.env: the `-rootless`
# variant of the BuildKit release the worker's `buildctl` comes from, which starts
# buildkitd through RootlessKit as uid 1000. The plain daemon image CI's
# docker-container builder runs (BUILDKIT_IMAGE) expects to be root and cannot start
# under this security context.
#
# The security context is the one BuildKit documents for Kubernetes
# (examples/kubernetes/*.rootless.yaml upstream): non-root uid 1000, seccomp and AppArmor
# unconfined because RootlessKit unshares user and mount namespaces and mounts overlays,
# `--oci-worker-no-process-sandbox` because a PID namespace cannot be unshared without
# `privileged`, and never `privileged`. Privilege escalation stays allowed on this one
# container: newuidmap and newgidmap are setuid and are how RootlessKit maps /etc/subuid,
# so a build can create files owned by other users (apt's _apt, dpkg's package owners).
# Nothing here reaches the node: no hostPath, no host namespace, no Docker socket.
#
# TLS is off on purpose. The port is a ClusterIP in a namespace whose own NetworkPolicy
# admits only `crucible-workers`, and a worker reaches it only through the per-attempt
# egress rule the provider writes (26), so the policies are the trust boundary.
#
# Off unless `buildkit.enabled`: a namespace at the `privileged` Pod Security level is
# the cluster operator's decision. Names stay `crucible-buildkit` under nameOverride
# because the provider addresses the builder by that constant; only the namespace it
# admits follows the workers namespace.
{{- if .Values.buildkit.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crucible-buildkit-cache
  namespace: crucible-buildkit
  labels:
    app.kubernetes.io/name: crucible-buildkit
spec:
  {{- with include "hades.buildkitCacheStorageClass" . }}
  storageClassName: {{ . | quote }}
  {{- end }}
  # The layer cache. 50 GiB is the documented default (docs/deployment.md): the two
  # worker images and their fetch stages, with room for a pin bump beside the last
  # build. A deployer sizes it with storage.buildkitCacheSize; BuildKit prunes within
  # what it has.
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.buildkitCacheSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: crucible-buildkit
  namespace: crucible-buildkit
  labels:
    app.kubernetes.io/name: crucible-buildkit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crucible-buildkit
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crucible-buildkit
  namespace: crucible-buildkit
  labels:
    app.kubernetes.io/name: crucible-buildkit
spec:
  replicas: 1
  # One daemon owns the cache claim; a rollout stops the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible-buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible-buildkit
      annotations:
        # The pre-1.30 spelling of the container's appArmorProfile below.
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: Unconfined
      containers:
        - name: buildkitd
          # images/pins.env BUILDKIT_ROOTLESS_IMAGE; a unit test keeps the two equal.
          image: moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --oci-worker-no-process-sandbox
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [buildctl, --addr, tcp://127.0.0.1:1234, debug, workers]
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            privileged: false
            allowPrivilegeEscalation: true
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: crucible-buildkit-cache

# Who may reach the builder: an attempt's worker or verifier Pod, through the egress
# rule the provider writes for a contract that requires the image checks (26, hades
# #475). Everything else in the cluster is refused at this end as well, so a Pod outside
# `crucible-workers` cannot use Hades's builder even without a policy of its own.
# Egress is not restricted here: BuildKit fetches the pinned base image, the Debian
# snapshot and the release archives the worker Dockerfile names, exactly as CI's
# builder does.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: crucible-buildkit
  namespace: crucible-buildkit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: crucible-buildkit
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "hades.workersNamespace" . }}
      ports:
        - protocol: TCP
          port: 1234
{{- end }}
