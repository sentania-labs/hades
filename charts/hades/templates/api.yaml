---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hades.name" . }}-api
  namespace: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
# The api Deployment (01): stateless, every request a transaction. One replica in the
# base because the artifact claim and the first-run administrator flow are simpler to
# reason about with one; an overlay may raise it.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hades.name" . }}-api
  namespace: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crucible
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "hades.name" . }}-supervisor
      {{- if .Values.cluster.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.cluster.imagePullSecret | quote }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # First boot brings PostgreSQL up beside these pods, so without this the first
        # few starts fail on a refused connection and the restart backoff grows past any
        # reasonable rollout timeout. The wait reads the DSN it is about to use and
        # nothing else; the password in it is never printed, parsed or logged.
        - name: wait-for-database
          image: {{ include "hades.serviceImage" . }}
          # The base tracks `latest`, and Kubernetes defaults an unpinned `latest` tag to
          # `imagePullPolicy: Always`; explicit here so a local proof never reaches a
          # registry and a real deployment's exact-pinned tag still resolves once, at
          # whichever digest the deployer set (24).
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, socket, sys, time
              from urllib.parse import urlsplit
              url = urlsplit(os.environ["CRUCIBLE_DATABASE__URL"])
              host, port = url.hostname or "", url.port or 5432
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=5):
                          print(f"{host}:{port} is accepting connections", flush=True)
                          sys.exit(0)
                  except OSError as exc:
                      print(f"waiting for {host}:{port}: {type(exc).__name__}", flush=True)
                      time.sleep(3)
              sys.exit("the database never accepted a connection")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CRUCIBLE_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName }}
                  key: url
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: api
          image: {{ include "hades.serviceImage" . }}
          imagePullPolicy: IfNotPresent
          command: ["crucible", "serve", "--api"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "hades.name" . }}-settings
          env:
            - name: CRUCIBLE_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName }}
                  key: url
          # `/v1/ready` is this process's readiness: the database answers and the schema
          # is at head. The supervisor's health is reported in the same response and on
          # `/v1/supervisor` and does not fail it, so a supervisor in trouble never takes
          # the API and the admin UI out of the Service (hades #190).
          readinessProbe:
            httpGet:
              path: /v1/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          # Deliberately slack. `GET /v1/admin/status` asks every provider for its
          # health, and the Kubernetes provider answers by running 26's readiness canary:
          # a real Pod, created, waited for, read and deleted. A liveness probe tight
          # enough to kill the api for that would restart the process every time an
          # administrator opened the status page.
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: artifacts
              mountPath: /var/lib/crucible/artifacts
            # 12: the App key and the webhook secret, on the `hades` pods only. No
            # worker, collector, verifier or publisher ever mounts this.
            - name: github
              mountPath: /var/lib/crucible/credentials/github
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: {{ include "hades.name" . }}-artifacts
        # The GitHub App Secret the service owns (ADR 0017). Optional by design, not by
        # accident (crucible#79): the service creates it when the operator connects the
        # App, so a fresh deployment has none and must still start. The key is read
        # through the API server, not from this mount; the mount carries the webhook
        # secret to the webhook route, and a missing key is named on the GitHub page and
        # at startup when `github.enabled` says one should be there.
        - name: github
{{- if or .Values.secrets.githubAppPrivateKey .Values.secrets.githubAppWebhook }}
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ .Values.secrets.githubAppPrivateKey | default .Values.secrets.githubApp | quote }}
                  optional: true
                  items:
                    - key: app.pem
                      path: app.pem
              - secret:
                  name: {{ .Values.secrets.githubAppWebhook | default .Values.secrets.githubApp | quote }}
                  optional: true
                  items:
                    - key: webhook.secret
                      path: webhook.secret
{{- else }}
          secret:
            secretName: {{ .Values.secrets.githubApp }}
            optional: true
            defaultMode: 0400
{{- end }}
        - name: tmp
          emptyDir: {}
# 23: the webhook is the optional accelerator and the API is how the operator reaches
# /ui. The host and the TLS reference are the overlay's; no DNS record is created here or
# anywhere in this repository (operator rule 10, 26 item 8).
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hades.name" . }}-api
  namespace: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hades.name" . }}-api
                port:
                  name: http
{{- end }}
