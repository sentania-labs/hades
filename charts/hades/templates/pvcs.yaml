# The artifact root (14, 26). The api serves stored artifacts and the supervisor writes
# them, and they are separate Deployments on this topology, so the claim is
# ReadWriteMany. That is a prerequisite on the cluster's storage, listed in the runbook
# and in 26's checklist; object storage for artifacts is a later phase (26).
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hades.name" . }}-artifacts
  namespace: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: artifacts
spec:
  {{- with include "hades.artifactsStorageClass" . }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: {{ .Values.storage.artifactsSize }}

# The git reference cache the preparer clones from (26). One claim for the namespace,
# mounted read-write into the preparer, which refreshes and may replace its bare mirror
# (C8a). The storage class is storage.referenceCacheStorageClass: a cluster's classes
# are lab-admin's, not this repository's.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hades.name" . }}-reference-cache
  namespace: {{ include "hades.workersNamespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: reference-cache
spec:
  {{- with include "hades.referenceCacheStorageClass" . }}
  storageClassName: {{ . | quote }}
  {{- end }}
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.storage.referenceCacheSize }}
