# One account for both Deployments, bound to the Role in `hades-workers` (see
# ../workers/rolebinding.yaml) and, in this namespace, to two Secrets and nothing else:
# the GitHub App Secret the service owns (github-app-rbac.yaml, ADR 0017) and deleting the
# one first-run administrator Secret (first-run-rbac.yaml, ADR 0016). None cluster-wide.
#
# 26 calls this "the supervisor's ServiceAccount" and the supervisor is what creates
# attempt objects with it. The api Deployment uses the same account because the admin
# status page (25) reports provider health, and the Kubernetes provider answers that by
# running the namespace readiness canary: the api process makes real API calls to
# `hades-workers` on every status read, so a second, weaker account would only mean a
# status page that says the cluster is broken when it is not.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hades.name" . }}-supervisor
  namespace: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane

# The worker's account (26): no Role, no RoleBinding, and no token mounted. Every worker,
# collector, verifier, preparer and publisher Pod runs as this account, so a harness that
# found a token would find one that can do nothing.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hades.name" . }}-worker
  namespace: {{ include "hades.workersNamespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
