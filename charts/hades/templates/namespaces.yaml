# Crucible's own namespace (01, 26): the api and supervisor Deployments, PostgreSQL, and
# the only place the GitHub App key and webhook secret are ever mounted (12).
#
# `restricted` here too. These are Crucible's own trusted pods and the untrusted half of
# the system is `hades-workers`, so `baseline` would have been defensible; but every
# pod this base creates already satisfies `restricted`, including PostgreSQL, which runs
# as uid 999 with a read-only root and an emptyDir for its socket. Enforcing what is
# already true costs nothing and means a later edit that adds a root container, a
# hostPath or a hostPort is refused rather than merely warned about.
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "hades.namespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

# The workers namespace (26). Pod Security admission at `restricted` is what enforces
# the pod shape independently of Crucible's own code: it is the surviving half of 13's
# create-request policy, so it is a property of the namespace and not of the provider.
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "hades.workersNamespace" . }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: workers
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest

{{- if .Values.buildkit.enabled }}

# Hades's own image builder gets a namespace of its own (hades #475). Rootless BuildKit
# documents a Pod whose seccomp and AppArmor profiles are both `Unconfined` (it unshares
# user and mount namespaces and mounts overlays as uid 1000); the Baseline standard
# permits neither profile, so the Pod cannot live under `hades`'s `restricted`
# admission or any `baseline` relaxation of it. Pod Security admission is per namespace,
# so the one Pod that needs the privileged level is the only thing in this namespace.
#
# What isolates it: the NetworkPolicy beside this file admits ingress from the
# `hades-workers` namespace on port 1234 and from nowhere else, the Deployment runs
# as uid 1000 and is never `privileged`, and the warn and audit modes stay at
# `baseline`, so the two unconfined profiles are the only expected finding on each
# rollout and anything beyond them is logged. The name is `buildkit.namespace`, the
# provider's KUBERNETES__BUILDKIT_NAMESPACE, so it does not follow nameOverride;
# `buildkit.enabled` renders it. It must differ from both namespaces above: one name for
# two of them would render that Namespace twice, the second time at `privileged`, and
# take `restricted` away from the service or the workers.
{{- $buildkitNamespace := .Values.buildkit.namespace }}
{{- if or (eq $buildkitNamespace (include "hades.namespace" .)) (eq $buildkitNamespace (include "hades.workersNamespace" .)) }}
{{- fail (printf "buildkit.namespace %q is also the service's or the workers' namespace; BuildKit's privileged namespace must be its own" $buildkitNamespace) }}
{{- end }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $buildkitNamespace }}
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: buildkit
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: baseline
    pod-security.kubernetes.io/warn-version: latest
{{- end }}
