# The supervisor's only permission on the workers' side of the cluster (26). A Role, never
# a ClusterRole: no cluster-scoped verb of any kind. Its only other grants are two narrow
# Secret grants in `crucible` (github-app-rbac.yaml, first-run-rbac.yaml).
#
# The verb set is what `crucible/adapters/execution/k8sapi.py` can actually emit, which
# is narrower than "everything on these kinds" and slightly wider than 26's original
# sentence. The two additions are the ones the implemented provider needs and 26 now
# records:
#
#   patch on persistentvolumeclaims  the retention label cleanup writes (26, cleanup)
#   patch on secrets                 the `rw-narrow` credential sync-back (12, 26)
#   get and list on resourcequotas   `max_concurrency` on GET /providers (26)
#   get and list on events           a Job whose Pod the namespace quota refused
#                                    (`FailedCreate`) fails at once, not at its timeout
#
# pods/log is a GET, so `get` is its verb. pods/exec carries both: the client opens the
# reader Pod's tar stream as a GET WebSocket upgrade, and the API server authorizes an
# exec against `create` as well, so a Role with only `get` is refused at the upgrade.
#
# The admin login Job and the service-owned harness Secrets (25, ADR 0015) need nothing
# more. The login is a Job with its own NetworkPolicy (create, list, delete), its URL is
# read from pods/log, the pasted code and the auth files cross on pods/exec, and the
# harness Secret is created when absent and replaced with one merge patch (create, get,
# patch). The api Deployment runs the login and uses this same account (26). The login
# lock that keeps two api replicas from logging one harness in at once is a ConfigMap
# (create, get, delete, the verbs already here). `update` is deliberately absent:
# nothing replaces an object whole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-supervisor
  namespace: crucible-workers
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: supervisor
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["resourcequotas", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "watch", "delete"]
