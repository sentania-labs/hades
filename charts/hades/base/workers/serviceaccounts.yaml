# The worker's account (26): no Role, no RoleBinding, and no token mounted. Every worker,
# collector, verifier, preparer and publisher Pod runs as this account, so a harness that
# found a token would find one that can do nothing.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crucible-worker
  namespace: crucible-workers
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: worker
automountServiceAccountToken: false
