# The control plane's grant on the GitHub App credential Secret in its own namespace (ADR
# 0017), which the service owns; its other grant here is deleting the first-run Secret
# (first-run-rbac.yaml, ADR 0016). Create GitHub App creates it the first time
# it writes, labelled `app.kubernetes.io/managed-by: crucible`, and replaces its data with
# one merge patch on each later write; the api and the supervisor read it through the API
# server on each signature.
#
# `get` and `patch` name the one Secret. `create` cannot: the API server authorizes a
# create before the object has a name, so RBAC ignores resourceNames on it. That is the
# widening, and it is in `crucible`, where no worker ever runs. Paired with `get`, it lets
# a process that is already compromised mint a token Secret under this name before the
# first connect; the service refuses any Secret of this name that is not Opaque. The other
# accounts in `crucible` are `default`, bound to nothing, and `crucible-migrate`, whose
# create-and-patch grant for the first-run Secret (first-run-rbac.yaml, ADR 0016) adds
# nothing this Role lacks but a patch of that one Secret (ADR 0017). `list`,
# `watch`, `update` and `delete` are absent: nothing here enumerates, replaces or removes
# a Secret, and the database Secret stays out of reach.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-github-app
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.githubApp | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crucible-github-app
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: control-plane
subjects:
  - kind: ServiceAccount
    name: crucible-supervisor
    namespace: crucible
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crucible-github-app
