# Helm gives each release revision a new Job, avoiding immutable pod-template patches.
# It stays a regular resource so the database, ConfigMap and RBAC install together.
# Migrations run once per sync, before anything serves: `crucible serve` refuses to start
# when the schema is not at head, so a deployment without this Job is a CrashLoopBackOff
# with the right reason rather than a corrupt database.
#
# The Argo annotations make it a sync hook that is recreated on every sync; a plain
# `kubectl apply -k` creates it once, and `make deploy-kind` deletes it before applying.
# A Job's pod template is immutable, so re-creation is how a changed image reaches it.
apiVersion: batch/v1
kind: Job
metadata:
  name: crucible-migrate-{{ .Release.Revision }}
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crucible
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      # The one API call this Job makes is creating the first-run administrator Secret
      # (ADR 0016), under an account that may do that and nothing else
      # (first-run-rbac.yaml). The token is never printed.
      serviceAccountName: crucible-migrate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # First boot brings PostgreSQL up beside these pods, so without this the first
        # few starts fail on a refused connection and the restart backoff grows past any
        # reasonable rollout timeout. The wait reads the DSN it is about to use and
        # nothing else; the password in it is never printed, parsed or logged.
        - name: wait-for-database
          image: {{ include "hades.serviceImage" . }}
          # The base tracks `latest`, and Kubernetes defaults an unpinned `latest` tag to
          # `imagePullPolicy: Always`; explicit here so a local proof never reaches a
          # registry and a real deployment's exact-pinned tag still resolves once, at
          # whichever digest the deployer set (24).
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, socket, sys, time
              from urllib.parse import urlsplit
              url = urlsplit(os.environ["CRUCIBLE_DATABASE__URL"])
              host, port = url.hostname or "", url.port or 5432
              deadline = time.monotonic() + 300
              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=5):
                          print(f"{host}:{port} is accepting connections", flush=True)
                          sys.exit(0)
                  except OSError as exc:
                      print(f"waiting for {host}:{port}: {type(exc).__name__}", flush=True)
                      time.sleep(3)
              sys.exit("the database never accepted a connection")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: CRUCIBLE_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName }}
                  key: url
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
      containers:
        - name: migrate
          image: {{ include "hades.serviceImage" . }}
          imagePullPolicy: IfNotPresent
          command: ["crucible", "admin", "migrate"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - configMapRef:
                name: crucible-settings
          env:
            - name: CRUCIBLE_DATABASE__URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.databaseSecretName }}
                  key: url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
