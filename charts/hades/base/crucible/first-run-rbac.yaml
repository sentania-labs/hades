# The first-run administrator token (ADR 0016, crucible#122). The migrate Job writes the
# one-time token into the Secret `crucible-first-run-admin` in this namespace instead of
# printing it, because a pod log is shipped off the cluster by whatever collects logs.
# The api deletes that Secret when the first-run principal first signs in or is revoked.
#
# Two narrow grants, both in `crucible` and nowhere else:
#
# - `crucible-migrate` may create Secrets here and patch that one. Kubernetes cannot
#   restrict `create` by resource name, so the create grant covers the namespace; the
#   account is used by the migrate Job alone, whose command is fixed in the image.
# - `crucible-supervisor` (the api's account) may delete that one Secret and nothing
#   else. It cannot read it.
#
# Nobody in Crucible can read the Secret back: reading it is the operator's
# `kubectl get secret`, under the operator's own cluster permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crucible-migrate
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: migrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-first-run-admin-writer
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: migrate
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.firstRunToken | quote }}]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crucible-first-run-admin-writer
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: migrate
subjects:
  - kind: ServiceAccount
    name: crucible-migrate
    namespace: crucible
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crucible-first-run-admin-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crucible-first-run-admin-remover
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.firstRunToken | quote }}]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crucible-first-run-admin-remover
  namespace: crucible
  labels:
    app.kubernetes.io/name: crucible
    app.kubernetes.io/component: api
subjects:
  - kind: ServiceAccount
    name: crucible-supervisor
    namespace: crucible
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crucible-first-run-admin-remover
